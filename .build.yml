# This build would not be necessary if SourceHut would support reStructuredText
image: nixos/unstable
oauth: git.sr.ht/PROFILE:RO git.sr.ht/REPOSITORIES:RW
packages:
   - nixos.cachix
   - nixos.curl
   - nixos.hut
   - nixos.jq
environment:
   repo_id: "142654"
   repo_name: "github-less-social"
   cachix_cache: "toastal"
secrets:
   - d44053aa-7f58-49fc-9bb9-ed6930cd7f68 # cachix
tasks:
   - prepare: |
      set -eo pipefail
      # Enable flakes.
      mkdir -p $HOME/.config/{nix,nixpkgs}
      echo "experimental-features = nix-command flakes" > $HOME/.config/nix/nix.conf
      # Setup Cachix
      set +x
      cachix authtoken --stdin < "$HOME/.${cachix_cache}-cachix-auth-token"
      set -x
      cachix use $cachix_cache
   - readme: |
      set -eo pipefail
      cd "$repo_name"
            default_branch_name="$(basename $(git symbolic-ref refs/remotes/origin/HEAD))"
      default_branch_head_commit="$(git show-ref "refs/heads/$default_branch_name" | awk '{print $1}')"

      current_commit="$(git rev-parse --verify HEAD)"
      if [[ "$current_commit" != "$default_branch_head_commit" ]]; then
         echo "Commit not on the default branch, ${default_branch_name}. README will not be updated."
         exit 0
      fi
      nix --accept-flake-config build ".#readme" --json --out-link "result-readme" \
         | jq -r '.[].outputs | to_entries[].value' \
         | cachix push $cachix_cache
      hut git update "$repo_name" --readme "$(realpath result-readme)/README.html"
